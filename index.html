<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Under Construction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .geometric-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.1;
        }

        .geometric-shape {
            position: absolute;
            border: 2px solid #ffffff;
        }

        .shape-1 {
            top: 10%;
            left: 10%;
            width: 150px;
            height: 150px;
            transform: rotate(45deg);
            animation: rotateFloat 20s linear infinite;
        }

        .shape-2 {
            top: 60%;
            right: 15%;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
        }

        .shape-3 {
            bottom: 20%;
            left: 20%;
            width: 80px;
            height: 80px;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            animation: float 8s ease-in-out infinite;
        }

        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 300;
            margin-bottom: 1.5rem;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 1.2s ease-out 0.5s forwards;
            letter-spacing: 3px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.3rem;
            margin-bottom: 4rem;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 1.2s ease-out 1s forwards;
            color: #b3d4fc;
            font-weight: 300;
            line-height: 1.6;
        }

        .construction-section {
            margin-bottom: 4rem;
            opacity: 0;
            animation: slideUpFade 1.2s ease-out 1.5s forwards;
        }

        .construction-icon {
            font-size: 5rem;
            margin-bottom: 3rem;
            opacity: 0.8;
            animation: pulse 3s ease-in-out infinite;
        }

        .message-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            transform: translateY(40px);
            animation: slideUpFade 1s ease-out 2s forwards;
            margin-bottom: 4rem;
            max-width: 600px;
        }

        .message-text {
            font-size: 1.1rem;
            color: #e8f0fe;
            line-height: 1.7;
            font-weight: 300;
        }

        .progress-section {
            margin-bottom: 4rem;
            opacity: 0;
            animation: slideUpFade 1s ease-out 2.5s forwards;
        }

        .progress-title {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: #b3d4fc;
            font-weight: 400;
        }

        .progress-bar {
            width: 100%;
            max-width: 400px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin: 0 auto;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a90e2, #357abd);
            border-radius: 3px;
            width: 0;
            animation: fillProgress 2s ease-out 3s forwards;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s ease-in-out infinite;
        }

        .footer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #b3d4fc;
            font-size: 0.9rem;
            opacity: 0;
            animation: slideUpFade 1s ease-out 3.5s forwards;
            text-align: center;
        }

        .year {
            color: #ffffff;
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fillProgress {
            to {
                width: 70%;
            }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes rotateFloat {
            0% { transform: rotate(45deg) translateY(0px); }
            50% { transform: rotate(225deg) translateY(-20px); }
            100% { transform: rotate(405deg) translateY(0px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes gentleGlow {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(74, 144, 226, 0.1);
            }
            50% { 
                box-shadow: 0 0 30px rgba(74, 144, 226, 0.2);
            }
        }

        .message-card {
            animation: slideUpFade 1s ease-out 2s forwards, gentleGlow 5s ease-in-out infinite 3s;
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
                letter-spacing: 2px;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
            
            .construction-icon {
                font-size: 4rem;
            }
            
            .message-card {
                padding: 2rem 1.5rem;
            }
            
            .message-text {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            
            .main-title {
                font-size: 2rem;
                letter-spacing: 1px;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .construction-icon {
                font-size: 3.5rem;
            }
            
            .message-card {
                padding: 1.5rem;
                margin-bottom: 3rem;
            }
        }

        /* Subtle background animation */
        .container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            animation: breathe 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="geometric-bg">
        <div class="geometric-shape shape-1"></div>
        <div class="geometric-shape shape-2"></div>
        <div class="geometric-shape shape-3"></div>
    </div>

    <div class="container">
        <h1 class="main-title">Coming Soon</h1>
        <p class="subtitle">Under Construction</p>
        
        <div class="construction-section">
            <div class="construction-icon">🔧</div>
        </div>
        
        <div class="message-card">
            <div class="message-text">
                We're currently working hard to bring you something new. Thank you for your patience as we put the finishing touches on our project.
            </div>
        </div>
        
        <div class="progress-section">
            <div class="progress-title">Progress</div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
        
        <div class="footer">
            <span class="year">2025</span>
        </div>
    </div>

    <script>
        // Simple Coming Soon Page
        class ComingSoonPage {
            constructor() {
                this.init();
            }

            private init(): void {
                this.createParallaxEffect();
            }

            private createParallaxEffect(): void {
                document.addEventListener('mousemove', (e) => {
                    const shapes = document.querySelectorAll('.geometric-shape');
                    const mouseX = e.clientX / window.innerWidth;
                    const mouseY = e.clientY / window.innerHeight;

                    shapes.forEach((shape, index) => {
                        const speed = (index + 1) * 0.01;
                        const x = (mouseX - 0.5) * speed * 50;
                        const y = (mouseY - 0.5) * speed * 50;
                        
                        (shape as HTMLElement).style.transform += ` translate(${x}px, ${y}px)`;
                    });
                });

                // Gentle scroll effects
                window.addEventListener('scroll', () => {
                    const scrolled = window.pageYOffset;
                    const rate = scrolled * -0.2;
                    
                    const bg = document.querySelector('.geometric-bg') as HTMLElement;
                    if (bg) {
                        bg.style.transform = `translateY(${rate}px)`;
                    }
                });
            }
        }

        // Initialize page
        const comingSoonPage = new ComingSoonPage();
    </script>
</body>
</html>
